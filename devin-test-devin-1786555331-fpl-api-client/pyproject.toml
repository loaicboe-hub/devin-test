[project]
name = "fpl-analysis"
version = "0.1.0"
description = "Fetch and analyse official Fantasy Premier League data"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fpl = "fpl.cli:main"
fpl-web = "fpl.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fpl"]

[tool.setuptools.package-data]
fpl = ["static/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
